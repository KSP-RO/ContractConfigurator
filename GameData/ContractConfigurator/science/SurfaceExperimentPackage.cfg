// This file contains experiment definitions for AlbertKermin's Surface
// Experiment Package
//
// Author: nightingale
//
// Since SEP 2.0 every experiment has three levels (Basic/Detailed/Exhaustive),
// each with its own experiment id. The old single ids (SEP_PSE, ...) no longer exist.
// Only SEP_WeatherScan requires an atmosphere; SEP_CCIDscan and SEP_SolarwindSpectrum
// can't be run inside one (excludeAtmosphere = True on the parts). The remaining
// experiments have no atmosphere restriction in SEP itself.
// ModuleSEPScienceExperiment stores only the base id (experimentID = SEP_PSE), so the
// part mapping is given explicitly. Part names use the loaded spelling (SEP.PSE): KSP
// replaces '_' with '.' in AvailablePart.name and the science rules compare it as-is.

CC_EXPERIMENT_DEFINITIONS
