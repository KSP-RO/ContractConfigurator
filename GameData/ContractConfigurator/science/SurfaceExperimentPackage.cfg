// This file contains experiment definitions for AlbertKermin's Surface
// Experiment Package
//
// Author: nightingale
//
// Since SEP 2.0 every experiment has three levels (Basic/Detailed/Exhaustive),
// each with its own experiment id. The old single ids (SEP_PSE, ...) no longer exist.
// Only SEP_WeatherScan requires an atmosphere; SEP_CCIDscan can't be run inside one
// (excludeAtmosphere = True on the part). The remaining experiments have no
// atmosphere restriction in SEP itself.
// ModuleSEPScienceExperiment stores only the base id (experimentID = SEP_PSE), so the
// part mapping is given explicitly.

CC_EXPERIMENT_DEFINITIONS
