CONTRACT_TYPE
{
    name = SpawnVesselTraitTest_Existing
    //group = BehaviourTest
    maxSimultaneous = 1
    targetBody = Kerbin
    title = SpawnVesselTraitTest_ExistingTitle
    description = description
    synopsis = synopsis
    completedMessage = completedMessage

    PARAMETER
    {
        name = RecoverKerbal
        type = RecoverKerbal
        index = 0
    }
    BEHAVIOUR
    {
        name = SpawnVessel
        type = SpawnVessel
        CONDITION 
		{
			condition = CONTRACT_ACCEPTED
		}
        VESSEL
        {
            name = TestVesselOne
            craftPart = mk2LanderCabin_v2
            vesselType = Ship
            owned = true
            ORBIT
            {
                SMA = 700000.0
                ECC = 0
                INC = 0
                LPE = 0
                LAN = 0
                MNA = 0
                EPH = UniversalTime()
                REF = 1
            }
            CREW
            {
                name = Jebediah Kerman

                // Existing crewmember will be lost
                addToRoster = false
            }
            CREW
            {
                name = Bill Kerman

                addToRoster = true
            }
        }
    }
}

